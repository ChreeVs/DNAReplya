# Render.com Blueprint Specification for DNAReplya
services:
  - type: web
    name: dnareplya
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: ./data/dnareplya.db
      - key: META_VERIFY_TOKEN
        value: dnareplya_meta_verify_token_secure
      # Turso Cloud Database (Option 2)
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # AI BYOK Keys (OpenAI, Gemini, Claude)
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Telegram
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
